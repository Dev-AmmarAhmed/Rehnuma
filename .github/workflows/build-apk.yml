name: Build Rehnuma Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps
      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Configure Android Permissions & Strings
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST"
          fi
          STRINGS="android/app/src/main/res/values/strings.xml"
          if ! grep -q "server_client_id" "$STRINGS"; then
            sed -i 's|</resources>|    <string name="server_client_id">409507107740-rfe62bavasn54neat2vic0mjop81p2ks.apps.googleusercontent.com</string>\n</resources>|' "$STRINGS"
          fi
      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Extract Debug Keystore SHA-1
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" > android/app/build/outputs/apk/debug/sha1.txt || true
          cat android/app/build/outputs/apk/debug/sha1.txt
      - name: Upload Generated APK & SHA1
        uses: actions/upload-artifact@v4
        with:
          name: Rehnuma-Society-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/sha1.txt
