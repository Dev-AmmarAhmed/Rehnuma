name: Build Rehnuma Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps
      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: Inject Configs & Set Version 2.0
        run: |
          sed -i 's/versionCode [0-9]*/versionCode 10/g' android/app/build.gradle
          sed -i 's/versionName "[0-9\.]*"/versionName "2.0"/g' android/app/build.gradle
          cp google-services.json android/app/google-services.json || true
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST"
          fi
          STRINGS="android/app/src/main/res/values/strings.xml"
          if ! grep -q "server_client_id" "$STRINGS"; then
            sed -i 's|</resources>|    <string name="server_client_id">409507107740-rfe62bavasn54neat2vic0mjop81p2ks.apps.googleusercontent.com</string>\n</resources>|' "$STRINGS"
          fi
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -importkeystore -srckeystore rehnuma.keystore -destkeystore ~/.android/debug.keystore -srcstorepass rehnuma123 -deststorepass android -srcalias rehnuma -destalias androiddebugkey -srckeypass rehnuma123 -destkeypass android -noprompt
      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: Rehnuma-Society-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
